# EV Spare Parts Classification Taxonomy
categories:
  high_voltage_powertrain:
    - code: "PART-HV-001"
      name: "Traction Battery Cell / Module"
      description: "Replacement LFP Blade / NMC pouch battery modules"
      criticality: "High"
      wear_rate: "Low"
      customs_priority: "Top"

    - code: "PART-HV-002"
      name: "Motor Control Unit (MCU) / Inverter"
      description: "Power inverter driving synchronous traction motor"
      criticality: "Critical"
      wear_rate: "Low-Moderate"
      customs_priority: "Top"

    - code: "PART-HV-003"
      name: "On-Board Charger (OBC)"
      description: "AC-DC converter unit (3.3kW / 6.6kW / 11kW)"
      criticality: "High"
      wear_rate: "Moderate (Voltage fluctuation sensitive)"
      customs_priority: "High"

    - code: "PART-HV-004"
      name: "High-Voltage DC-DC Converter"
      description: "Step-down converter from 400V to 12V auxiliary system"
      criticality: "High"
      wear_rate: "Moderate"
      customs_priority: "High"

  thermal_management:
    - code: "PART-TH-001"
      name: "Electric AC Compressor"
      description: "High-voltage scroll compressor for cabin and battery cooling"
      criticality: "High"
      wear_rate: "Moderate-High"
      customs_priority: "High"

    - code: "PART-TH-002"
      name: "Battery Heat Exchanger / Chiller"
      description: "Refrigerant-to-coolant battery pack thermal regulator"
      criticality: "Moderate"
      wear_rate: "Low"
      customs_priority: "Medium"

  chassis_suspension_brakes:
    - code: "PART-CH-001"
      name: "Front Suspension Strut & Shock Absorber"
      description: "Heavy-duty reinforced dampers adapted to EV curb weight"
      criticality: "High"
      wear_rate: "High (Addis Ababa road degradation)"
      customs_priority: "High"

    - code: "PART-CH-002"
      name: "Regenerative Friction Brake Pads (Ceramic/Metallic)"
      description: "Low-dust, high-torque brake pads for regen blend braking"
      criticality: "High"
      wear_rate: "Moderate"
      customs_priority: "High"

  electronics_sensors:
    - code: "PART-EL-001"
      name: "Charging Port Assembly (GB/T / CCS2)"
      description: "Inlet socket assembly, locking actuator and cable harness"
      criticality: "High"
      wear_rate: "Moderate"
      customs_priority: "High"

    - code: "PART-EL-002"
      name: "OBD-II Diagnostic Scanner & CAN Bridge"
      description: "Diagnostic hardware for fault clearing and cell balancing"
      criticality: "Essential (Tooling)"
      wear_rate: "Low"
      customs_priority: "High"
