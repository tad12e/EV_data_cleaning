# 10 Standardized EV Spare-Part Categories Configuration
# Scope: Mechanical Wear, Optical Safety, Exterior Collision & Climate Maintenance
version: "1.0"
part_categories:
  - id: "CAT-01-BRAKE-PADS"
    name: "Brake pads"
    code: "brake_pads"
    system: "Braking & Safety"
    typical_positions: ["Front Left", "Front Right", "Rear Left", "Rear Right"]
    wear_classification: "Fast Wear / Friction Consumable"
    safety_criticality: "Critical"
    estimated_replacement_cycle_km: "30,000 - 45,000 km (Adjusted for regenerative braking)"
    description: "Ceramic / Semi-metallic friction pads clamping rotor discs to decelerate vehicle."

  - id: "CAT-02-BRAKE-DISCS"
    name: "Brake discs"
    code: "brake_discs"
    system: "Braking & Safety"
    typical_positions: ["Front (Ventilated)", "Rear (Solid)"]
    wear_classification: "Medium Wear / Friction Rotor"
    safety_criticality: "Critical"
    estimated_replacement_cycle_km: "60,000 - 90,000 km"
    description: "Cast iron ventilated and solid brake disc rotors experiencing high thermal loads."

  - id: "CAT-03-CABIN-FILTERS"
    name: "Cabin-air filters"
    code: "cabin_air_filters"
    system: "Climate & HVAC"
    typical_positions: ["Under Glove Compartment / HVAC Intake"]
    wear_classification: "Fast Wear / Periodic Maintenance"
    safety_criticality: "Moderate (Occupant Air Quality & Blower Protection)"
    estimated_replacement_cycle_km: "10,000 - 15,000 km (High frequency in dusty Addis Ababa conditions)"
    description: "Particulate PM2.5 / CN95 activated carbon filtration elements for cabin ventilation."

  - id: "CAT-04-WIPER-BLADES"
    name: "Wiper blades"
    code: "wiper_blades"
    system: "Visibility & Safety"
    typical_positions: ["Windshield Driver Side", "Windshield Passenger Side", "Rear Window"]
    wear_classification: "Fast Wear / Weather Consumable"
    safety_criticality: "High (Rainy Season Driving Visibility)"
    estimated_replacement_cycle_km: "12 Months (Kiremt Rainy Season Prep)"
    description: "Frameless aerodynamic rubber/silicone wiper blades clearing windshield moisture."

  - id: "CAT-05-HEADLIGHTS"
    name: "Headlights"
    code: "headlights"
    system: "Lighting & Exterior Electrical"
    typical_positions: ["Front Left", "Front Right"]
    wear_classification: "Accident / Collision Replacement"
    safety_criticality: "Critical (Night Driving Illumination)"
    estimated_replacement_cycle_km: "Collision or Electrical Failure Dependent"
    description: "Integrated LED projector headlight assemblies with DRL and turn indicator modules."

  - id: "CAT-06-TAIL-LIGHTS"
    name: "Tail lights"
    code: "tail_lights"
    system: "Lighting & Exterior Electrical"
    typical_positions: ["Rear Left", "Rear Right", "Center Trunk Bar"]
    wear_classification: "Accident / Collision Replacement"
    safety_criticality: "High (Braking & Rear Signaling Visibility)"
    estimated_replacement_cycle_km: "Collision or Electrical Failure Dependent"
    description: "Full-width LED rear light clusters and brake signal assemblies."

  - id: "CAT-07-SIDE-MIRRORS"
    name: "Side mirrors"
    code: "side_mirrors"
    system: "Body Hardware & Visibility"
    typical_positions: ["Driver Side (Left)", "Passenger Side (Right)"]
    wear_classification: "Urban Collision / Traffic Damage Replacement"
    safety_criticality: "Critical (Lateral Visibility & Blind Spot Monitoring)"
    estimated_replacement_cycle_km: "Urban Traffic Strike / Theft Dependent"
    description: "Power-folding exterior rearview mirror assemblies with integrated turn signals and cameras."

  - id: "CAT-08-BUMPERS"
    name: "Bumpers"
    code: "bumpers"
    system: "Body Exterior & Structural Protection"
    typical_positions: ["Front Bumper Assembly", "Rear Bumper Assembly"]
    wear_classification: "Collision / Impact Damage"
    safety_criticality: "High (Low-Speed Impact Absorption & Pedestrian Protection)"
    estimated_replacement_cycle_km: "Urban Collision Dependent"
    description: "Molded polypropylene bumper covers, lower grilles, radar sensor mounts, and brackets."

  - id: "CAT-09-FENDERS"
    name: "Fender/body panels"
    code: "fenders_body_panels"
    system: "Body Exterior Stampings"
    typical_positions: ["Front Left Fender", "Front Right Fender", "Hood", "Doors", "Quarter Panels"]
    wear_classification: "Collision / Sheet Metal Damage"
    safety_criticality: "Moderate (Aerodynamic & Structural Integrity)"
    estimated_replacement_cycle_km: "Collision Dependent"
    description: "Stamped steel/aluminum outer body fenders, side panels, and mudguards protecting wheel wells."

  - id: "CAT-10-SHOCK-ABSORBERS"
    name: "Shock absorbers"
    code: "shock_absorbers"
    system: "Suspension & Handling"
    typical_positions: ["Front Left Strut", "Front Right Strut", "Rear Left Shock", "Rear Right Shock"]
    wear_classification: "Medium-High Wear (Rough Road Deterioration)"
    safety_criticality: "Critical (Vehicle Stability, Braking Pitch & Ride Control)"
    estimated_replacement_cycle_km: "40,000 - 60,000 km (Accelerated by rough road surfaces in Ethiopia)"
    description: "Hydraulic gas-charged damper assemblies engineered for heavier electric vehicle battery curb weight."
