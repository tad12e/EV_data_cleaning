# Scraper & Collector Source Registry
collectors:
  jiji:
    base_url: "https://jiji.com.et"
    categories: ["auto-parts-and-accessories"]
    rate_limit_seconds: 2

  adey_market:
    base_url: "https://adeymarket.com"
    categories: ["spare-parts"]
    rate_limit_seconds: 1.5

  telegram:
    channels:
      - "zemenmotors"
      - "Abyssiniancarsales"
      - "ethiocardealers"
      - "smartcarmarket"
      - "capitalcarmarket"
      - "ethiospareparts"
    max_history_days: 60

  tiktok_apify:
    actor_id: "clockworks/tiktok-scraper"
    search_queries: ["Ethiopia EV spare parts", "BYD maintenance Addis", "electric car repair Ethiopia"]

  government_sources:
    motl: "https://www.motl.gov.et"
    ecc: "https://www.ecc.gov.et"
    mofed: "https://www.mofed.gov.et"
    statsethiopia: "https://www.statsethiopia.gov.et"
